version: '3.8'

services:
  node:
    container_name: nodeapp-todo
    image: nodeapp:1.0
    build:
      context: .
      dockerfile: node.dockerfile
    ports:
      - 5000:3000
    # deploy:
    #   replicas: 2
    #   restart_policy:
    #     condition: on-failure
    #     delay: 5s
    #     max_attempts: 3
    #     window: 120s
    networks:
      - nodeapp-network
    depends_on:
      - mongodb

  mongodb:
    container_name: mongodb-todo
    image: mongo
    networks:
      - nodeapp-network
    environment:
      MONGO_INITDB_ROOT_USERNAME: root
      MONGO_INITDB_ROOT_PASSWORD: example

  mongo-express:
    container_name: mongo-express-todo
    image: mongo-express
    ports:
      - 8081:8081
    environment:
      ME_CONFIG_MONGODB_ADMINUSERNAME: root
      ME_CONFIG_MONGODB_ADMINPASSWORD: example
      ME_CONFIG_MONGODB_URL: mongodb://root:example@mongo:27017/

networks:
  nodeapp-network:
    driver: bridge